name: Secret scan

# Busca secretos (API keys, passwords, tokens) en TODO el historial de git, incluyendo
# el contenido de archivos comprimidos (.tar.gz, .zip...). Existe por el incidente del
# 29-sep-2026: un .env real viajó 6 meses dentro de project.tar.gz en un repo público.
# Copiable tal cual a cualquier repo del ecosistema.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Binario oficial fijado por versión y hash (la gitleaks-action exige licencia en orgs).
      - name: Instalar gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks

      # --max-archive-depth: sin esto, un .env dentro de un .tar.gz pasa inadvertido.
      # --redact: el log de CI nunca muestra el valor del secreto encontrado.
      - name: Buscar secretos
        run: ./gitleaks git . --no-banner --redact --max-archive-depth 3 --exit-code 1
